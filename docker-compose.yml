# ==============================================================================
# MarkItDown Full-Stack Multi-Container Orchestration (docker-compose.yml)
# Services:
#   1. markitdown-backend   - FastAPI + PyTorch + SQLite + MarkItDown Engine (:8000)
#   2. markitdown-frontend  - HTML/Vue3 + Axios Web UI + Nginx Reverse Proxy (:8080)
#   3. markitdown-mcp       - Model Context Protocol (MCP) Service (packages/markitdown-mcp)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Service: FastAPI + PyTorch + SQLite + MarkItDown Engine
  # ----------------------------------------------------------------------------
  markitdown-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: markitdown-backend
    ports:
      - "8000:8000"
    environment:
      # SQLite database configuration with persistence
      - DATABASE_URL=sqlite:////app/backend/data/markitdown.db
      # JWT security secret
      - JWT_SECRET=${JWT_SECRET:-markitdown-super-secret-key-change-in-prod-2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # External LLM / OpenAI configuration (Optional for Vision OCR)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # MarkItDown engine & classifier settings
      - MARKITDOWN_ENABLE_PLUGINS=True
      - CLASSIFIER_MODEL_TYPE=cnn
      - MAX_FILE_SIZE=52428800
    volumes:
      # SQLite database & file persistence volume
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - backend
          - markitdown-backend

  # ----------------------------------------------------------------------------
  # 2. Frontend Service: HTML/Vue3 + Axios Web Interface & Reverse Proxy
  # ----------------------------------------------------------------------------
  markitdown-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: markitdown-frontend
    ports:
      - "8080:8080"
    depends_on:
      markitdown-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      default:
        aliases:
          - frontend
          - markitdown-frontend

  # ----------------------------------------------------------------------------
  # 3. MCP Service: Model Context Protocol Server (reusing packages/markitdown-mcp)
  # ----------------------------------------------------------------------------
  markitdown-mcp:
    build:
      context: ./packages/markitdown-mcp
      dockerfile: Dockerfile
    container_name: markitdown-mcp
    # Keep STDIN open and allocate pseudo-TTY for standard STDIO transport
    stdin_open: true
    tty: true
    # If running MCP over Streamable HTTP/SSE instead of STDIO, uncomment below:
    # command: ["--http", "--host", "0.0.0.0", "--port", "3001"]
    # ports:
    #   - "3001:3001"
    volumes:
      - ./data:/workdir
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mcp
          - markitdown-mcp

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  backend_data:
    driver: local

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  default:
    name: markitdown-network
