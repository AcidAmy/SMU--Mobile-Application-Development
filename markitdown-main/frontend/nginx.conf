server {
    listen 8080 default_server;
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static web assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application routing (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to markitdown-backend FastAPI service
    location /api/ {
        proxy_pass http://markitdown-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload size limit matching backend (50MB)
        client_max_body_size 50M;

        # Timeouts for heavy document parsing and OCR vision models
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
